# Continuous integration: every pull request and every push to main is
# checked. A red X on the pull request means do not merge yet.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=CMS=${{ vars.CMS }} --dart-define=CMS_URL=${{ vars.CMS_URL }} --dart-define=CMS_SPACE=${{ vars.CMS_SPACE }} --dart-define=CMS_PROJECT=${{ vars.CMS_PROJECT }} --dart-define=CMS_DATASET=${{ vars.CMS_DATASET }} --dart-define=CMS_TOKEN=${{ secrets.CMS_TOKEN }}